meta:
  state: bootstrap
  note: >
    Conventions should be inferred from the real machine and then confirmed.
    Do not invent a new directory taxonomy simply to make the inventory look neat.

directories:
  machine_context_root: 'E:\MachineContext'
  known_roots: []

installation:
  prefer_existing_directory_conventions: true
  record_install_method: true
  record_update_method: true
  record_path_and_scope: true

updates:
  prefer_original_package_manager_or_vendor_updater: true
  verify_version_after_update: true

principles:
  - choose locations using actual existing machine conventions;
  - avoid unnecessary duplicate runtimes or package managers;
  - consider downstream relationships before moving or replacing tools;
  - record exceptions when a tool intentionally uses a non-default path;
