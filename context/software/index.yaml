schema_version: 1

modules:
  - path: development.yaml
    scope: development runtimes, package managers, SDKs, compilers, CLIs, and developer applications
  - path: ai.yaml
    scope: AI coding tools, harnesses, local bridges, and related agent tooling

extension_policy:
  note: >
    Add new software domains as modules instead of expanding one monolithic file.
    Future examples may include general.yaml, creative.yaml, or media.yaml.
