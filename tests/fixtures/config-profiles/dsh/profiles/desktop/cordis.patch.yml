# Fixture: the DSH profile Cordis patch layer, in the real file's dialect.
# Entries are {id, name, config} rows; `disabled: true` rows turn an entry off;
# an `insert:` block adds entries. The profile's cordis.yml is only the empty
# root these patches overlay, so it must never become a config source.
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: testrhythm
    model: test-glm
    reasoningEffort: max

- id: ui-theme
  name: '@deepseek-ai/dsh-client-ui-theme'
  config:
    preference: dark

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      testrhythm:
        displayName: 测试律动
        apiKeyEnv: TESTFIXTURE_API_KEY
        api: openai-completions
        baseURL: https://tokenrhythm.example.com/v1
        headers:
          X-Trace-Id: trace-value-not-allowlisted
        defaultInput:
          - text
          - image
        defaultMaxTokens: 131072
        models:
          - id: test-glm
            name: Test GLM
            contextWindow: 1050000
            maxTokens: 131072
            input:
              - text
            reasoningEfforts:
              low: low
              max: max
          - id: test-mini
            name: Test Mini
            contextWindow: 200000
            input: text

      badholder:
        displayName: 泄漏提供方
        apiKey: fake-refresh-token
        api: openai-responses
        baseURL: https://user:pass@leaky.example.com/v1?api_key=zzzz#frag
        models:
          - id: leaky
            name: Leaky
            contextWindow: 8000

      inlinekey:
        displayName: 内联密钥提供方
        apiKey: sk-test-do-not-publish
        baseURL: https://inline.example.com/v1
        models:
          - id: inline-model
            name: Inline Model
            contextWindow: 4096

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  config:
    baseURL: https://deepseek-mirror.example.com/v1
    models:
      - id: test-deepseek
        name: Test DeepSeek
        contextWindow: 1000000

- id: llm-retired
  disabled: true

- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    defaultPreset: workspace-write
    presets:
      read-only:
        sandbox: read-only
